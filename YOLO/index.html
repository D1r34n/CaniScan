<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>YOLOv8 Electron Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
      }
      button {
        padding: 12px 24px;
        font-size: 18px;
        cursor: pointer;
        border-radius: 8px;
        border: none;
        background-color: #0078d7;
        color: white;
      }
      button:hover {
        background-color: #005ea3;
      }
    </style>
  </head>
  <body>
    <h1>YOLOv8 Real-Time Detection</h1>
    <p>Click the button below to start the Python YOLO detection script.</p>
    <button id="startBtn">Run YOLO</button>

    <script>
      const { ipcRenderer } = require('electron');
      document.getElementById('startBtn').addEventListener('click', () => {
        ipcRenderer.send('run-yolo');
        alert('YOLO script started! Check your Python window.');
      });
    </script>
  </body>
</html>
